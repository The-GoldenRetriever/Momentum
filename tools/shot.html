<!doctype html><meta charset=utf-8><title>frame grab</title>
<style>html,body{margin:0;background:#08060f}canvas{image-rendering:pixelated;display:block;width:960px;height:540px}</style>
<canvas id=game width=480 height=270></canvas>
<script>
// a frame that never finishes says why in the title, where --dump-dom can see it
addEventListener('error', (e) => { document.title = `error: ${e.message} @${e.lineno}`; });
</script>
<script type="module">
// Deterministic frame grabber: ?at=<tile>&ay=<tile>&keys=right,down&steps=240 (&level=<n>)
import { Game } from '../src/game.js';
import { P } from '../src/player.js';
import { buildArt } from '../src/art.js';
import { Input } from '../src/input.js';
import { migrateSave } from '../src/save.js';
buildArt();
const q = new URLSearchParams(location.search);
const ctx = document.getElementById('game').getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;
// &best=<level id>:<seconds>,... stands in for saved best times (a fresh
// profile has none), to see unlocks and medal gates on the level select
if (q.has('best')) {
  migrateSave();                 // (first, or the version check would wipe them)
  for (const kv of q.get('best').split(',')) { const [id, t] = kv.split(':'); localStorage.setItem(`momentum.best.${id}`, t); }
}
const game = new Game(ctx, new Input(window));

class Keys {
  constructor() { this.down = new Set(); this.pressed = new Set(); this.released = new Set(); }
  set(list) {
    const next = new Set(list);
    for (const a of next) if (!this.down.has(a)) this.pressed.add(a);
    for (const a of this.down) if (!next.has(a)) this.released.add(a);
    this.down = next;
  }
  step() { this.pressed.clear(); this.released.clear(); }
  held(a) { return this.down.has(a); }
  hit(a) { return this.pressed.has(a); }
  let_go(a) { return this.released.has(a); }
  get moveX() { return (this.held('right') ? 1 : 0) - (this.held('left') ? 1 : 0); }
  get moveY() { return (this.held('down') ? 1 : 0) - (this.held('up') ? 1 : 0); }
}
const keys = new Keys();
const held = (q.get('keys') || '').split(',').filter(Boolean);
const steps = Number(q.get('steps') || 120);
const auto = q.get('auto');          // 'vault' calls every ledge; 'burst' also leaves auto-burst on
// (off otherwise, so a frame with a full bar is the frame asked for, not a wind-up)
game.player.autoBurst = game.autoBurst = auto === 'burst';
if (q.has('at')) game.player.reset(Number(q.get('at')) * 16, Number(q.get('ay') || 0) * 16);
if (q.has('vx')) game.player.vx = Number(q.get('vx'));
if (q.has('flow')) game.player.flow = Number(q.get('flow'));
const flip = Number(q.get('flip') || 0);   // step at which to reverse the stick
const duck = Number(q.get('duck') || 0);   // step at which to start holding DOWN
for (let i = 0; i < steps; i++) {
  const k = held.map((a) => (flip && i >= flip && (a === 'right' || a === 'left')
    ? (a === 'right' ? 'left' : 'right') : a));
  if (duck && i >= duck) k.push('down');
  if (auto && (game.player.cue || game.player.t.refund > 0)) k.push('vault');
  keys.set(k);
  game.update(1 / 120, keys);
  keys.step();
  if (q.has('flow') && !game.player.bursting) game.player.flow = Number(q.get('flow'));
}
game.timeScale = game.player.warp;
if (game.player.timeWarped) for (let i = 0; i < 30; i++) game.renderer.zoom += (1.25 - game.renderer.zoom) * 0.4;
game.cam.follow(game.player, 0.5);
// &next=<steps> finishes the level after the run, picks "next level" and
// plays that many steps of the walk-off / loading screen before grabbing
if (q.has('next')) {
  game.finished = true;
  game.nextLevel();
  const idle = new Keys();
  for (let i = 0; i < Number(q.get('next')); i++) game.update(1 / 120, idle, 1 / 120);
}
// &screen=title|select|pause|results|initials|board[&sel=<row>][&t=<s>] grabs one
// of the menus (&time=<s> sets the run's time for results and initials;
// board shows the board of &level, from the title)
const scr = q.get('screen');
const runTime = Number(q.get('time') || 63.42);
if (scr === 'title') game.toTitle();
else if (scr === 'results') { game.finished = true; game.time = runTime; game.best = 58.1; game.ui.show('results'); }
else if (scr === 'initials') { game.finished = true; game.time = runTime; game.ui.finishRun(); }
else if (scr === 'board') { game.playing = false; game.ui.show('title'); game.ui.show('board'); }
else if (scr) { if (scr === 'select') game.playing = false; game.ui.show(scr); }
if (scr && q.has('sel')) game.ui.sel = Number(q.get('sel'));
if (scr && q.has('t')) game.ui.t = Number(q.get('t'));   // (for anything that fades in)
if (scr && scr !== 'pause' && scr !== 'results') game.draw(1 / 150, 1 / 60);   // let the pan settle
// &menu=open|capture[&sel=<row>] grabs the binding screen over the frame
const menuArg = q.get('menu');
if (menuArg) {
  game.menu.show();
  game.menu.sel = Number(q.get('sel') || 0);
  game.menu.capturing = menuArg === 'capture';
  if (q.has('note')) { game.menu.note = q.get('note'); game.menu.noteT = 1; }
}
game.draw(1 / 150, 1 / 60);
document.title = 'ready';
</script>
