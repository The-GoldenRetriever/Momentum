<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>MOMENTUM — a pixel art speed platformer</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #08060f;
    overflow: hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #cbc4e6;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    background: #0b0a14;
    box-shadow: 0 0 0 1px #221c38, 0 24px 80px -20px #000;
  }
  #hint {
    position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
    font-size: 11px; letter-spacing: .12em; color: #4b4370;
    text-transform: uppercase; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game"></canvas></div>
  <div id="hint">click to focus &middot; F1 debug &middot; M mute &middot; R respawn &middot; T restart run</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
